index_path: memory/vector_index/chroma
collection_name: high_jump_memory

chunk_chars: 2600
chunk_overlap_chars: 300

embedding:
  type: hashing
  dimensions: 2048

include_globs:
  - CLAUDE.md
  - ROADMAP.md
  - ARCHITECTURE.md
  - HANDOFF.md
  - README.md
  - pyproject.toml
  - .github/copilot-instructions.md
